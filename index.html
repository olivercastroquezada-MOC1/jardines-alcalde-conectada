<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Jardines Alcalde Conectada</title>
<meta name="description" content="Portal oficial de avisos y seguridad digital de la colonia Jardines Alcalde, administrado por la Junta de Colonos.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FAF6EC; --surface:#FFFFFF; --surface-alt:#F3ECDA;
    --primary:#153F2E; --primary-dark:#0B2A1E; --primary-mid:#1F5A41; --primary-light:#E1EEE6;
    --accent:#E0932E; --accent-dark:#A96E1C; --accent-light:#FBEBD2; --accent-glow:#F5B84D;
    --coral:#D96B48; --coral-light:#FBE3D8;
    --danger:#B23B3B; --danger-light:#F9E6E6;
    --text:#1A1812; --text-secondary:#5C5748;
    --border:#E6DFCA; --radius:20px; --radius-sm:12px;
    --shadow-sm:0 2px 8px rgba(19,30,22,.07);
    --shadow-md:0 10px 28px -6px rgba(19,30,22,.16);
    --shadow-lg:0 22px 50px -12px rgba(11,42,30,.28);
    --grad-primary:linear-gradient(135deg,#1F5A41 0%,#0B2A1E 100%);
    --grad-accent:linear-gradient(135deg,#F5B84D 0%,#D96B48 100%);
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --maxw:640px;
  }
  *{box-sizing:border-box;}
  html{font-size:18px;-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
  html.text-lg{font-size:21px;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;padding-bottom:88px;min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;color:var(--primary-dark);line-height:1.18;margin:0 0 .4em;letter-spacing:-.01em;}
  h1{font-size:1.85rem;} h2{font-size:1.36rem;} h3{font-size:1.12rem;}
  p{margin:0 0 1em;}
  a{color:var(--primary);}
  button{font-family:inherit;}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
  img,svg{max-width:100%;display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  #app>*{animation:fadeUp .45s cubic-bezier(.16,1,.3,1) both;}
  #app>*:nth-child(1){animation-delay:0s;} #app>*:nth-child(2){animation-delay:.04s;}
  #app>*:nth-child(3){animation-delay:.08s;} #app>*:nth-child(4){animation-delay:.12s;}
  #app>*:nth-child(5){animation-delay:.16s;} #app>*:nth-child(n+6){animation-delay:.2s;}

  /* Header */
  .site-header{position:sticky;top:0;z-index:60;background:var(--grad-primary);color:#fff;box-shadow:0 4px 20px -8px rgba(11,42,30,.4);}
  .header-inner{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px;}
  .gate-mark{color:var(--accent-glow);flex-shrink:0;filter:drop-shadow(0 2px 5px rgba(0,0,0,.28));}
  .brand{flex:1;min-width:0;}
  .brand-name{display:block;font-family:var(--font-display);font-weight:600;font-size:1.2rem;line-height:1.15;letter-spacing:-.01em;}
  .brand-sub{display:block;font-size:.7rem;letter-spacing:.08em;color:var(--accent-glow);opacity:.95;font-weight:600;}
  .header-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .18s ease,transform .15s ease;}
  .icon-btn:hover{background:rgba(255,255,255,.26);}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn i{font-size:21px;}
  .text-toggle{gap:1px;}
  .text-toggle .ta-small{font-size:11px;font-weight:700;}
  .text-toggle .ta-large{font-size:18px;font-weight:700;margin-left:1px;}

  /* Nav */
  .main-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 4px;box-shadow:0 -10px 26px -10px rgba(19,30,22,.14);z-index:50;}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text-secondary);font-size:11px;padding:7px 6px;border-radius:14px;cursor:pointer;flex:1;max-width:88px;transition:color .15s ease,background .15s ease;}
  .nav-item i{font-size:22px;}
  .nav-item.active{color:var(--primary);font-weight:700;background:var(--primary-light);}
  .nav-item:focus-visible,.icon-btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent-glow);outline-offset:2px;border-radius:8px;}

  @media (min-width:768px){
    body{padding-bottom:0;}
    .main-nav{position:static;box-shadow:none;border-top:none;border-bottom:1px solid var(--border);gap:6px;padding:10px 16px;backdrop-filter:none;background:var(--surface);}
    .nav-item{flex-direction:row;flex:none;font-size:15px;padding:10px 18px;gap:8px;max-width:none;}
    .nav-item i{font-size:18px;}
  }

  /* Layout */
  main{max-width:var(--maxw);margin:0 auto;padding:20px 16px 40px;position:relative;}
  main.wide{max-width:920px;}
  .loading{padding:40px 0;text-align:center;color:var(--text-secondary);}
  footer{max-width:var(--maxw);margin:0 auto;padding:18px 16px 40px;color:var(--text-secondary);font-size:.82rem;text-align:center;}
  .admin-footer-link{background:none;border:none;color:var(--text-secondary);font-size:.76rem;opacity:.55;cursor:pointer;padding:6px;text-decoration:underline;text-underline-offset:2px;}
  .admin-footer-link:hover{opacity:1;}

  /* Portada de Inicio */
  .home-hero{background:var(--grad-primary);border-radius:0 0 32px 32px;margin:-20px -16px 24px;padding:36px 20px 42px;position:relative;overflow:hidden;color:#fff;text-align:center;}
  .home-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 78% 0%,rgba(245,184,77,.38),transparent 55%);pointer-events:none;}
  .home-hero-graphic{position:relative;margin:0 auto 14px;width:78px;height:78px;}
  .home-hero h1{color:#fff;font-size:1.95rem;margin-bottom:8px;position:relative;}
  .home-hero p{color:rgba(255,255,255,.85);font-size:1rem;max-width:340px;margin:0 auto;position:relative;}

  /* Feed: tarjeta fijada */
  .feed-pin{border:none;background:linear-gradient(135deg,var(--accent-light) 0%,#fff 65%);box-shadow:var(--shadow-md);position:relative;overflow:hidden;}
  .feed-pin::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad-accent);}
  .feed-pin-badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:10px;}
  .feed-pin-body{display:flex;gap:14px;align-items:flex-start;}
  .feed-pin-icon{flex-shrink:0;width:48px;height:48px;border-radius:14px;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:var(--shadow-sm);}
  .feed-pin-body h3{margin-bottom:4px;}
  .feed-pin-body p{color:var(--text-secondary);margin-bottom:8px;}

  /* Feed: publicaciones (avisos) */
  .feed-post{position:relative;overflow:hidden;padding:16px 17px;transition:transform .18s ease,box-shadow .18s ease;}
  .feed-post::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--grad-accent);}
  .feed-post:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .feed-post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .feed-post-avatar{width:40px;height:40px;border-radius:50%;background:var(--grad-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;box-shadow:var(--shadow-sm);}
  .feed-post-author{font-weight:700;font-size:.92rem;color:var(--text);}
  .feed-post-meta{font-size:.78rem;color:var(--text-secondary);}
  .feed-post-title{font-family:var(--font-display);font-weight:600;font-size:1.1rem;margin:0 0 5px;color:var(--text);}
  .feed-post-body{margin:0;color:var(--text-secondary);}
  .feed-section-label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary);margin:24px 0 12px;display:flex;align-items:center;gap:8px;}
  .feed-section-label::after{content:'';flex:1;height:1px;background:var(--border);}

  /* Academia: simulador de chat */
  .chat-sim{background:linear-gradient(160deg,var(--surface-alt),var(--surface));border-radius:var(--radius);padding:18px;border:1px solid var(--border);}
  .chat-bubble{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:12px 15px;max-width:88%;box-shadow:var(--shadow-sm);}
  .chat-bubble-from{font-size:.74rem;color:var(--text-secondary);margin-bottom:3px;}
  .chat-bubble-text{font-size:.95rem;}
  .chat-choice-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .chat-choice-btns .btn{width:auto;flex:1;min-width:150px;}
  .chat-outcome{margin-top:12px;padding:12px 14px;border-radius:10px;display:flex;gap:9px;align-items:flex-start;font-size:.92rem;}
  .chat-outcome.good{background:var(--primary-light);color:var(--primary-dark);border-left:4px solid var(--primary);}
  .chat-outcome.bad{background:var(--danger-light);color:#7A2727;border-left:4px solid var(--danger);}
  .chat-outcome i{margin-top:2px;flex-shrink:0;}

  /* Academia: medidor de contraseña */
  .pwd-tool input{margin-top:6px;}
  .pwd-meter{height:12px;border-radius:8px;background:var(--border);margin-top:12px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08);}
  .pwd-bar{height:100%;width:0;border-radius:8px;transition:width .3s cubic-bezier(.16,1,.3,1),background .3s ease;}
  .pwd-label{margin-top:7px;font-size:.86rem;font-weight:600;color:var(--text-secondary);}

  /* Academia: mockup del teléfono (verificación en dos pasos) */
  .phone-steps{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .phone-steps svg{flex-shrink:0;filter:drop-shadow(var(--shadow-sm));}
  .phone-steps ol{flex:1;min-width:180px;padding-left:20px;margin:0;}
  .phone-steps li{margin-bottom:8px;}

  /* Academia: tarjetas volteables */
  .flip-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .flip-card{background:none;border:none;padding:0;cursor:pointer;height:120px;perspective:1000px;text-align:left;}
  .flip-card-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.16,1,.3,1);transform-style:preserve-3d;}
  .flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}
  .flip-front,.flip-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius-sm);padding:13px;display:flex;align-items:center;font-size:.86rem;}
  .flip-front{background:var(--grad-primary);color:#fff;font-weight:700;box-shadow:var(--shadow-sm);}
  .flip-back{background:var(--surface);border:1.5px solid var(--accent);color:var(--text);transform:rotateY(180deg);font-size:.82rem;box-shadow:var(--shadow-sm);}

  /* Academia: checklist interactivo */
  .check-list{display:flex;flex-direction:column;gap:9px;}
  .check-step{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;text-align:left;cursor:pointer;font-size:.94rem;color:var(--text);transition:all .18s ease;}
  .check-box{flex-shrink:0;width:23px;height:23px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:transparent;transition:all .18s ease;}
  .check-step.done{border-color:var(--primary);background:var(--primary-light);box-shadow:var(--shadow-sm);}
  .check-step.done .check-box{background:var(--grad-primary);border-color:var(--primary);color:#fff;}
  .check-step.done span.step-text{text-decoration:line-through;color:var(--text-secondary);}
  .check-progress{margin-top:10px;font-size:.84rem;color:var(--text-secondary);font-weight:700;}

  /* Tarjetas y secciones */
  .section-block{margin-bottom:26px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .section-head h2{margin:0;}
  .link-btn{background:none;border:none;color:var(--primary);font-weight:700;font-size:.92rem;cursor:pointer;padding:4px;white-space:nowrap;}
  .view-intro{color:var(--text-secondary);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);margin-bottom:14px;}
  .empty-state{background:var(--surface-alt);border:1.5px dashed var(--border);border-radius:var(--radius);padding:24px 18px;text-align:center;color:var(--text-secondary);}
  .empty-state i{font-size:30px;color:var(--primary);margin-bottom:8px;display:block;}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad-primary);color:#fff;border:none;border-radius:14px;padding:14px 20px;font-weight:700;font-size:1rem;cursor:pointer;width:100%;box-shadow:var(--shadow-sm);transition:transform .15s ease,box-shadow .15s ease;}
  .btn:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn.secondary{background:var(--surface);color:var(--primary);border:1.5px solid var(--primary);box-shadow:none;}
  .btn.secondary:hover{background:var(--primary-light);box-shadow:none;transform:none;}
  .btn.danger{background:var(--danger);}
  .btn.small{width:auto;padding:10px 16px;font-size:.88rem;}

  /* Forms */
  label{display:block;font-weight:700;margin-bottom:6px;font-size:.95rem;}
  .field{margin-bottom:16px;}
  .hint{color:var(--text-secondary);font-size:.82rem;margin-top:5px;}
  input[type=text],input[type=date],input[type=tel],select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:1rem;font-family:inherit;background:var(--surface);color:var(--text);transition:border-color .15s ease;}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);}
  textarea{min-height:90px;resize:vertical;}
  .radio-group,.pin-row{display:flex;flex-wrap:wrap;gap:8px;}
  .radio-opt{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;flex:1;min-width:120px;background:var(--surface);transition:all .15s ease;}
  .radio-opt input{width:18px;height:18px;flex-shrink:0;}
  .radio-opt.checked{border-color:var(--primary);background:var(--primary-light);}
  .error-text{color:var(--danger);font-size:.85rem;margin-top:6px;display:none;}
  .error-text.show{display:block;}
  .scale-row{display:flex;gap:6px;}
  .scale-opt{position:relative;flex:1;text-align:center;padding:11px 0;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-weight:700;background:var(--surface);transition:all .15s ease;}
  .scale-opt input{position:absolute;opacity:0;width:1px;height:1px;}
  .scale-opt:focus-within{outline:3px solid var(--accent-glow);outline-offset:2px;}
  .scale-opt.checked{border-color:var(--primary);background:var(--grad-primary);color:#fff;}
  .scale-labels{display:flex;justify-content:space-between;font-size:.76rem;color:var(--text-secondary);margin-top:4px;}
  .confirm-box{background:linear-gradient(135deg,var(--primary-light),var(--surface));border:1px solid var(--primary);border-radius:var(--radius);padding:22px;text-align:center;color:var(--primary-dark);box-shadow:var(--shadow-sm);}
  .confirm-box i{font-size:32px;margin-bottom:8px;display:block;color:var(--primary);}

  /* Quiz */
  .quiz-card{margin-bottom:28px;}
  .quiz-card h3{display:flex;align-items:center;gap:9px;}

  /* Academia: lecciones */
  .lesson{margin-bottom:20px;}
  .lesson h3{display:flex;gap:9px;align-items:flex-start;}
  .lesson h3 i{color:var(--accent-dark);font-size:1.1rem;margin-top:3px;flex-shrink:0;}
  .rule-box{background:var(--primary-light);border-left:4px solid var(--primary);border-radius:10px;padding:13px 15px;margin-top:10px;font-weight:600;color:var(--primary-dark);}
  .alert-box{background:var(--danger-light);border-left:4px solid var(--danger);border-radius:10px;padding:13px 15px;margin-top:10px;}
  .steps-list{padding-left:22px;margin:8px 0;}
  .steps-list li{margin-bottom:6px;}

  /* Directorio */
  .dir-card{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .dir-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--grad-primary);}
  .dir-card .dir-name{font-weight:700;}
  .dir-card .dir-rol{color:var(--text-secondary);font-size:.85rem;}
  .dir-card .dir-contacto{font-weight:700;color:var(--primary);white-space:nowrap;}

  /* Admin */
  .pin-screen{max-width:340px;margin:36px auto;text-align:center;}
  .pin-screen i{font-size:40px;color:var(--primary);}
  .pin-input{letter-spacing:.5em;text-align:center;font-size:1.5rem;font-weight:700;}
  .admin-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
  .admin-tab{flex-shrink:0;background:var(--surface);border:1.5px solid var(--border);color:var(--text-secondary);padding:9px 14px;border-radius:999px;font-size:.86rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
  .admin-tab.active{background:var(--grad-primary);color:#fff;border-color:transparent;box-shadow:var(--shadow-sm);}
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .progress-pill{display:inline-flex;align-items:center;gap:7px;background:var(--grad-accent);color:#fff;font-weight:700;padding:8px 15px;border-radius:999px;font-size:.9rem;box-shadow:var(--shadow-sm);}
  table.data-table{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--surface);}
  table.data-table th,table.data-table td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.data-table th{background:var(--surface-alt);color:var(--primary-dark);font-family:var(--font-display);}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
  .row-actions{display:flex;gap:6px;}
  .icon-action{background:none;border:1px solid var(--border);border-radius:8px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);transition:all .15s ease;}
  .icon-action.danger{color:var(--danger);border-color:var(--danger-light);}
  .icon-action.danger:hover{background:var(--danger-light);}
  .stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .stat-box{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;box-shadow:var(--shadow-sm);}
  .stat-box .stat-num{font-family:var(--font-display);font-size:1.7rem;font-weight:700;color:var(--primary);}
  .stat-box .stat-label{color:var(--text-secondary);font-size:.8rem;}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <svg class="gate-mark" width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 42 L10 18 L24 6 L38 18 L38 42" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="42" x2="40" y2="42" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
    <div class="brand">
      <span class="brand-name">Jardines Alcalde</span>
      <span class="brand-sub">CONECTADA · CANAL OFICIAL</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn text-toggle" id="fontToggle" aria-label="Aumentar tamaño del texto" title="Aumentar tamaño del texto"><span class="ta-small">A</span><span class="ta-large">A</span></button>
    </div>
  </div>
</header>

<nav class="main-nav" aria-label="Navegación principal">
  <button class="nav-item" data-nav="inicio"><i class="ti ti-home"></i><span>Inicio</span></button>
  <button class="nav-item" data-nav="avisos"><i class="ti ti-bell"></i><span>Avisos</span></button>
  <button class="nav-item" data-nav="academia"><i class="ti ti-shield-check"></i><span>Academia</span></button>
  <button class="nav-item" data-nav="recursos"><i class="ti ti-book-2"></i><span>Recursos</span></button>
  <button class="nav-item" data-nav="autoeval"><i class="ti ti-clipboard-check"></i><span>Cuestionarios</span></button>
</nav>

<main id="app"><div class="loading">Cargando…</div></main>

function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatFecha(iso){
  const d = new Date(iso);
  if(isNaN(d)) return escapeHtml(iso);
  return `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
}
function formatFechaCorta(iso){
  const d = new Date(iso);
  if(isNaN(d)) return escapeHtml(iso);
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}
function newId(prefix){ return prefix + Date.now() + '-' + Math.random().toString(36).slice(2,8); }

/* Almacenamiento: cada colección de Firestore corresponde a un prefijo
   (aviso, directorio, quizutil, quizseg, asisportal, asisseg). Cada registro
   es un documento con su propio ID (evita choques cuando varias personas
   guardan al mismo tiempo). */
function parsePrefixedKey(key){
  const idx = key.indexOf(':');
  return { collection: key.slice(0, idx), docId: key.slice(idx+1) };
}
async function loadByPrefix(prefix){
  const collectionName = prefix.replace(/:$/, '');
  try{
    const snap = await db.collection(collectionName).get();
    const items = [];
    snap.forEach(docSnap=>{
      const obj = docSnap.data();
      obj._key = collectionName + ':' + docSnap.id;
      items.push(obj);
    });
    return items;
  }catch(e){ console.error('Error al leer', prefix, e); return []; }
}
async function saveItem(key, data){
  const {collection, docId} = parsePrefixedKey(key);
  try{ await db.collection(collection).doc(docId).set(data); return true; }
  catch(e){ console.error('Error al guardar', key, e); return false; }
}
async function deleteItem(key){
  const {collection, docId} = parsePrefixedKey(key);
  try{ await db.collection(collection).doc(docId).delete(); return true; }
  catch(e){ console.error('Error al borrar', key, e); return false; }
}

/* CSV */
function toCSV(headers, rows){
  const esc = v => { const s=(v===undefined||v===null)?'':String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines=[headers.map(esc).join(',')];
  rows.forEach(r=>lines.push(r.map(esc).join(',')));
  return lines.join('\r\n');
}
function downloadCSV(filename, headers, rows){
  const csv = '\uFEFF' + toCSV(headers, rows);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function evaluarFuerzaPwd(pwd){
  let score = 0;
  if(pwd.length>=8) score++;
  if(pwd.length>=12) score++;
  if(/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
  if(/[0-9]/.test(pwd)) score++;
  if(/[^A-Za-z0-9]/.test(pwd)) score++;
  return Math.min(score,4);
}
function actualizarMedidorPwd(input){
  const bar = document.getElementById('pwdBar');
  const label = document.getElementById('pwdLabel');
  if(!bar||!label) return;
  const val = input.value;
  if(!val){ bar.style.width='0%'; label.textContent='Empieza a escribir para ver qué tan fuerte es'; return; }
  const niveles = [
    {w:'20%',c:'var(--danger)',t:'Muy débil — fácil de adivinar'},
    {w:'40%',c:'var(--danger)',t:'Débil — agrégale más caracteres'},
    {w:'65%',c:'var(--accent)',t:'Regular — casi lista'},
    {w:'85%',c:'var(--primary)',t:'Fuerte'},
    {w:'100%',c:'var(--primary)',t:'Muy fuerte'}
  ];
  const n = niveles[evaluarFuerzaPwd(val)];
  bar.style.width=n.w; bar.style.background=n.c; label.textContent=n.t;
}

  const fechaVal = fd.get('fecha') ? new Date(fd.get('fecha')+'T12:00:00').toISOString() : new Date().toISOString();
  const data = {categoria:fd.get('categoria'), titulo, descripcion, fecha:fechaVal};
  const btn=form.querySelector('button[type=submit]'); btn.disabled=true;
  const saved = await saveItem(newId('aviso:'), data);
  if(saved) await refreshAdminContent(); else { btn.disabled=false; alert('No se pudo publicar. Intenta de nuevo.'); }
}
async function handleDeleteAviso(key){
  if(!confirm('¿Eliminar este aviso? Esta acción no se puede deshacer.')) return;
  await deleteItem(key); await refreshAdminContent();
}

/* --- Directorio (admin) --- */
function dirAdminRowHtml(d){
  return `
    <div class="card dir-card">
      <div>
        <div class="dir-name">${escapeHtml(d.nombre)}</div>
        <div class="dir-rol">${escapeHtml(d.rol)}</div>
        <div class="dir-contacto" style="margin-top:2px">${escapeHtml(d.contacto)}</div>
      </div>
      <button class="icon-action danger" data-action="delete-directorio" data-id="${d._key}" aria-label="Eliminar contacto"><i class="ti ti-trash"></i></button>
    </div>`;
}
async function renderAdminDirectorio(){
  const dir = await loadByPrefix('directorio:');
  const rows = dir.length ? dir.map(dirAdminRowHtml).join('') : `<div class="empty-state"><i class="ti ti-address-book"></i>Aún no hay contactos.</div>`;
  return `
    <div class="card">
      <h3 style="margin-bottom:12px"><i class="ti ti-plus"></i> Agregar contacto</h3>
      <form id="form-add-directorio" novalidate>
        <div class="field"><label for="dir-nombre">Nombre</label><input type="text" id="dir-nombre" name="nombre" placeholder="Ej. Junta de Colonos"><div class="error-text" data-error-for="nombre">Escribe un nombre.</div></div>
        <div class="field"><label for="dir-rol">Descripción</label><input type="text" id="dir-rol" name="rol" placeholder="Ej. Contacto oficial de la colonia"></div>
        <div class="field"><label for="dir-contacto">Teléfono / contacto</label><input type="text" id="dir-contacto" name="contacto" placeholder="Ej. 33 1234 5678"><div class="error-text" data-error-for="contacto">Escribe un contacto.</div></div>
        <button type="submit" class="btn"><i class="ti ti-send"></i>Agregar al directorio</button>
      </form>
    </div>
    <div class="section-head" style="margin-top:22px"><h2>Contactos (${dir.length})</h2></div>
    ${rows}
  `;
}
async function handleAddDirectorio(form){
  const fd = new FormData(form);
  const nombre=(fd.get('nombre')||'').trim(), contacto=(fd.get('contacto')||'').trim();
  form.querySelector('[data-error-for="nombre"]').classList.toggle('show', !nombre);
  form.querySelector('[data-error-for="contacto"]').classList.toggle('show', !contacto);
  if(!nombre||!contacto) return;
  const data = {nombre, rol:(fd.get('rol')||'').trim(), contacto};
  const btn=form.querySelector('button[type=submit]'); btn.disabled=true;
  const saved = await saveItem(newId('directorio:'), data);
  if(saved) await refreshAdminContent(); else { btn.disabled=false; alert('No se pudo guardar.'); }
}
async function handleDeleteDirectorio(key){
  if(!confirm('¿Eliminar este contacto?')) return;
  await deleteItem(key); await refreshAdminContent();
}

/* --- Resultados: uso y utilidad (admin) --- */
async function renderAdminQuizUtil(){
  const data = (await loadByPrefix('quizutil:')).sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  const n = data.length;
  const avgProb = n ? (data.reduce((s,d)=>s+Number(d.probabilidad||0),0)/n).toFixed(1) : '—';
  const avgFac = n ? (data.reduce((s,d)=>s+Number(d.facilidad||0),0)/n).toFixed(1) : '—';
  const rows = data.map(d=>`
    <tr><td>${formatFechaCorta(d.fecha)}</td><td>${escapeHtml(d.nombre)||'—'}</td><td>${d.sabia==='si'?'Sí':'No'}</td>
    <td>${escapeHtml(d.probabilidad)}/5</td><td>${escapeHtml(d.facilidad)}/5</td><td>${escapeHtml(d.moduloFav)}</td><td>${escapeHtml(d.comentario)||'—'}</td></tr>`).join('');
  const tableHtml = n ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Nombre</th><th>Sabía de avisos</th><th>Probabilidad de uso</th><th>Facilidad</th><th>Módulo favorito</th><th>Comentario</th></tr></thead><tbody>${rows}</tbody></table></div>`
    : `<div class="empty-state"><i class="ti ti-clipboard-off"></i>Todavía no hay respuestas de este cuestionario.</div>`;
  return `
    <div class="admin-toolbar">
      <h2 style="margin-bottom:0">Resultados: Uso y utilidad</h2>
      ${n?`<button class="btn secondary small" data-action="download-quizutil"><i class="ti ti-download"></i>Descargar CSV</button>`:''}
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num">${n}</div><div class="stat-label">Respuestas</div></div>
      <div class="stat-box"><div class="stat-num">${avgProb}</div><div class="stat-label">Probabilidad de uso (prom.)</div></div>
      <div class="stat-box"><div class="stat-num">${avgFac}</div><div class="stat-label">Facilidad de uso (prom.)</div></div>
    </div>
    ${tableHtml}
  `;
}
async function handleDownloadQuizUtil(){
  const data = (await loadByPrefix('quizutil:')).sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));
  const headers = ['Fecha','Nombre','Sabía dónde acudir','Probabilidad de uso (1-5)','Facilidad de uso (1-5)','Módulo favorito','Comentario'];
  const rows = data.map(d=>[formatFechaCorta(d.fecha), d.nombre||'', d.sabia==='si'?'Sí':'No', d.probabilidad, d.facilidad, d.moduloFav, d.comentario||'']);
  downloadCSV('cuestionario-uso-y-utilidad.csv', headers, rows);
}

/* --- Resultados: seguridad digital (admin) --- */
async function renderAdminQuizSeg(){
  const data = (await loadByPrefix('quizseg:')).sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  const n = data.length;
  const correctas = data.filter(d=>d.correcta).length;
  const pctCorrecta = n ? Math.round(correctas/n*100) : 0;
  const avgUtil = n ? (data.reduce((s,d)=>s+Number(d.utilidad||0),0)/n).toFixed(1) : '—';
  const respLabel = {a:'Dárselo si dice ser familiar', b:'Nunca compartirlo', c:'Solo si insiste', d:'Preguntar su nombre'};
  const rows = data.map(d=>`
    <tr><td>${formatFechaCorta(d.fecha)}</td><td>${escapeHtml(d.nombre)||'—'}</td>
    <td>${d.recibioFraude==='si'?'Sí':(d.recibioFraude==='no'?'No':'No seguro')}</td>
    <td>${d.correcta?'<strong style="color:var(--primary)">Correcta</strong>':'<strong style="color:var(--danger)">Incorrecta</strong>'} — ${escapeHtml(respLabel[d.respuestaCodigo]||d.respuestaCodigo)}</td>
    <td>${escapeHtml(d.senalAlerta)||'—'}</td><td>${escapeHtml(d.utilidad)}/5</td></tr>`).join('');
  const tableHtml = n ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Nombre</th><th>¿Recibió fraude?</th><th>Respuesta código WhatsApp</th><th>Señal de alerta (abierta)</th><th>Utilidad</th></tr></thead><tbody>${rows}</tbody></table></div>`
    : `<div class="empty-state"><i class="ti ti-clipboard-off"></i>Todavía no hay respuestas de este cuestionario.</div>`;
  return `
    <div class="admin-toolbar">
      <h2 style="margin-bottom:0">Resultados: Seguridad digital</h2>
      ${n?`<button class="btn secondary small" data-action="download-quizseg"><i class="ti ti-download"></i>Descargar CSV</button>`:''}
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num">${n}</div><div class="stat-label">Respuestas</div></div>
      <div class="stat-box"><div class="stat-num">${pctCorrecta}%</div><div class="stat-label">Respondió correcto (meta: 70%)</div></div>
      <div class="stat-box"><div class="stat-num">${avgUtil}</div><div class="stat-label">Utilidad de la sesión (prom.)</div></div>
    </div>
    ${tableHtml}
  `;
}
async function handleDownloadQuizSeg(){
  const data = (await loadByPrefix('quizseg:')).sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));
  const headers = ['Fecha','Nombre','Recibió intento de fraude','Respuesta (código WhatsApp)','¿Correcta?','Señal de alerta mencionada','Utilidad (1-5)'];
  const rows = data.map(d=>[formatFechaCorta(d.fecha), d.nombre||'', d.recibioFraude, d.respuestaCodigo, d.correcta?'Sí':'No', d.senalAlerta||'', d.utilidad]);
  downloadCSV('cuestionario-seguridad-digital.csv', headers, rows);
}

/* --- Asistencia / beneficiarios (admin) --- */
async function renderAdminAsistencia(prefix, label){
  const data = (await loadByPrefix(prefix)).sort((a,b)=> new Date(b.fecha)-new Date(a.fecha));
  const n = data.length, meta = 15, pct = Math.min(100, Math.round(n/meta*100));
  const today = new Date().toISOString().slice(0,10);
  const rows = data.map(d=>`
    <tr><td>${escapeHtml(d.nombre)}</td><td>${escapeHtml(d.perfil)}</td><td>${formatFechaCorta(d.fecha)}</td>
    <td><button class="icon-action danger" data-action="delete-asistencia" data-id="${d._key}" aria-label="Eliminar registro"><i class="ti ti-trash"></i></button></td></tr>`).join('');
  const tableHtml = n ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Nombre</th><th>Perfil</th><th>Fecha</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
    : `<div class="empty-state"><i class="ti ti-users"></i>Todavía no hay beneficiarios registrados en esta lista.</div>`;
  return `
    <div class="card">
      <h3 style="margin-bottom:12px"><i class="ti ti-plus"></i> Registrar asistencia — ${escapeHtml(label)}</h3>
      <form id="form-add-asistencia" data-prefix="${prefix}" data-label="${escapeHtml(label)}" novalidate>
        <div class="field"><label for="as-nombre">Nombre del beneficiario</label><input type="text" id="as-nombre" name="nombre" placeholder="Nombre completo"><div class="error-text" data-error-for="nombre">Escribe un nombre.</div></div>
        <div class="field"><label for="as-perfil">Perfil</label>
          <select id="as-perfil" name="perfil"><option>Adulto mayor</option><option>Comerciante</option><option>Joven</option><option>Padre/madre de familia</option><option>Otro</option></select>
        </div>
        <div class="field"><label for="as-fecha">Fecha</label><input type="date" id="as-fecha" name="fecha" value="${today}"></div>
        <button type="submit" class="btn"><i class="ti ti-send"></i>Registrar</button>
      </form>
    </div>
    <div class="admin-toolbar" style="margin-top:22px">
      <h2 style="margin-bottom:0">${escapeHtml(label)}</h2>
      ${n?`<button class="btn secondary small" data-action="download-asistencia" data-prefix="${prefix}" data-label="${escapeHtml(label)}"><i class="ti ti-download"></i>Descargar CSV</button>`:''}
    </div>
    <div class="progress-pill"><i class="ti ti-target-arrow"></i>${n} / ${meta} beneficiarios mínimos (${pct}%)</div>
    <div style="height:14px"></div>
    ${tableHtml}
  `;
}
async function handleAddAsistencia(form){
  const prefix = form.dataset.prefix;
  const fd = new FormData(form);
  const nombre = (fd.get('nombre')||'').trim();
  form.querySelector('[data-error-for="nombre"]').classList.toggle('show', !nombre);
  if(!nombre) return;
  const fechaVal = fd.get('fecha') ? new Date(fd.get('fecha')+'T12:00:00').toISOString() : new Date().toISOString();
  const data = {nombre, perfil:fd.get('perfil'), fecha:fechaVal};
  const btn=form.querySelector('button[type=submit]'); btn.disabled=true;
  const saved = await saveItem(newId(prefix), data);
  if(saved) await refreshAdminContent(); else { btn.disabled=false; alert('No se pudo registrar.'); }
}
async function handleDeleteAsistencia(key){
  if(!confirm('¿Eliminar este registro de asistencia?')) return;
  await deleteItem(key); await refreshAdminContent();
}
async function handleDownloadAsistencia(prefix, label){
  const data = (await loadByPrefix(prefix)).sort((a,b)=> new Date(a.fecha)-new Date(b.fecha));
  const headers = ['Nombre','Perfil','Fecha'];
  const rows = data.map(d=>[d.nombre, d.perfil, formatFechaCorta(d.fecha)]);
  downloadCSV('asistencia-'+label.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv', headers, rows);
}
async function handlePinSubmit(form){
  const fd = new FormData(form);
  const val = (fd.get('pin')||'').trim();
  if(val === ADMIN_PIN){ state.adminUnlocked = true; await render(); }
  else{
    const err = document.getElementById('pin-error');
    if(err) err.classList.add('show');
    const inp = document.getElementById('pin-input');
    if(inp){ inp.value=''; inp.focus(); }
  }
}
async function handleAdminLock(){
  state.adminUnlocked = false; state.adminTab = 'avisos';
  await navigateTo('inicio');
}
async function handleAdminTabClick(tabId){
  state.adminTab = tabId;
  await render();
}

/* ===================== EVENTOS GLOBALES ===================== */
document.addEventListener('click', (e)=>{
  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){ navigateTo(navBtn.dataset.nav); return; }
  const tabBtn = e.target.closest('[data-admin-tab]');
  if(tabBtn){ handleAdminTabClick(tabBtn.dataset.adminTab); return; }
  const actionBtn = e.target.closest('[data-action]');
  if(actionBtn){
    const action = actionBtn.dataset.action;
    if(action==='admin-lock') handleAdminLock();
    else if(action==='delete-aviso') handleDeleteAviso(actionBtn.dataset.id);
    else if(action==='delete-directorio') handleDeleteDirectorio(actionBtn.dataset.id);
    else if(action==='delete-asistencia') handleDeleteAsistencia(actionBtn.dataset.id);
    else if(action==='download-quizutil') handleDownloadQuizUtil();
    else if(action==='download-quizseg') handleDownloadQuizSeg();
    else if(action==='download-asistencia') handleDownloadAsistencia(actionBtn.dataset.prefix, actionBtn.dataset.label);
    else if(action==='chat-choice') handleChatChoice(actionBtn.dataset.choice);
    else if(action==='call-choice') handleCallChoice(actionBtn.dataset.choice);
    else if(action==='flip-card') handleFlipCard(actionBtn);
    else if(action==='toggle-check') handleToggleCheck(actionBtn);
  }
});
document.addEventListener('input', (e)=>{
  if(e.target.id==='pwd-test') actualizarMedidorPwd(e.target);
});
document.addEventListener('change', (e)=>{
  if(e.target.matches('input[type=radio]')){
    const name = e.target.name;
    document.querySelectorAll(`input[name="${name}"]`).forEach(inp=>{
      const wrap = inp.closest('.radio-opt,.scale-opt');
      if(wrap) wrap.classList.toggle('checked', inp.checked);
    });
  }
});
document.addEventListener('submit', (e)=>{
  e.preventDefault();
  const id = e.target.id;
  if(id==='form-pin') handlePinSubmit(e.target);
  else if(id==='form-academia-registro') handleAcademiaRegistro(e.target);
  else if(id==='form-quiz-util') handleQuizUtilSubmit(e.target);
  else if(id==='form-quiz-seg') handleQuizSegSubmit(e.target);
  else if(id==='form-add-aviso') handleAddAviso(e.target);
  else if(id==='form-add-directorio') handleAddDirectorio(e.target);
  else if(id==='form-add-asistencia') handleAddAsistencia(e.target);
});
const fontToggleBtn = document.getElementById('fontToggle');
if(fontToggleBtn){ fontToggleBtn.addEventListener('click', ()=>{ document.documentElement.classList.toggle('text-lg'); }); }

/* ===================== INICIO DE LA APP ===================== */
(async function init(){
  try{ await seedIfEmpty(); }catch(e){ console.error('Error al preparar datos iniciales', e); }
  setActiveNav('inicio');
  await render();
})();
</script>
</body>
</html>
